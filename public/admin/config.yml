# Sveltia CMS — the editing interface at /admin.
#
# Deliberately narrow. Only the eight files below are reachable from here, and
# every field is typed: prices are number inputs, images go through an uploader
# (with no "paste a URL" option, since next/image would refuse an outside host
# and fail the build), links are checked against a pattern. Nothing else on the
# site can be reached, because nothing else is described below.
#
# What is NOT editable here, on purpose:
#   - the legal notice and the privacy policy (they cross-reference each other
#     and carry compliance obligations)
#   - headings, the hero's text, button labels, navigation labels, the contact
#     word sequence (composition, not content). The photos and where the main
#     buttons lead are editable; the words around them are not.
#   - the service feature lists (the training card claims to contain the diète
#     card whole, and a build-time check enforces that — editing one list and
#     not the other would fail the publish with an error nobody here can read)
#
# Saving commits to GitHub, and Vercel rebuilds. Allow a minute or two before
# a change is visible on the live site.

backend:
  name: github
  repo: HyperWebAgency/Naiiscoaching
  branch: main

# Uploads land in `public/` and are referenced from the root, which is where
# every existing image already lives.
media_folder: public
public_folder: /

locale: fr

collections:
  - name: contenu
    label: Contenu du site
    files:
      # ─── Prices ────────────────────────────────────────────────────────────
      - name: tarifs
        label: Tarifs
        file: content/tarifs.json
        icon: euro_symbol
        description: >-
          Les prix affichés dans « Mes accompagnements ». Pour les formules
          annuelles, saisis seulement le prix mensuel et le prix annuel : le
          prix barré, l’économie et l’équivalent par mois sont calculés
          automatiquement à partir de ces deux nombres.
        fields:
          - name: trainingDieteMindset
            label: Suivi training + diète & mindset
            widget: object
            fields:
              - name: monthly
                label: Prix par mois (€)
                widget: number
                value_type: int
                min: 1
              - name: annual
                label: Prix pour l’année, payée en une fois (€)
                widget: number
                value_type: int
                min: 1

          - name: dieteMindset
            label: Suivi diète & mindset
            widget: object
            fields:
              - name: monthly
                label: Prix par mois (€)
                widget: number
                value_type: int
                min: 1
              - name: annual
                label: Prix pour l’année, payée en une fois (€)
                widget: number
                value_type: int
                min: 1

          - name: posing
            label: Suivi posing à distance (1 mois)
            widget: object
            fields:
              - name: monthly
                label: Prix par mois (€)
                widget: number
                value_type: int
                min: 1

          - name: posingComplet
            label: Suivi posing complet (3 mois)
            widget: object
            fields:
              - name: total
                label: Prix pour les 3 mois, payés en une fois (€)
                widget: number
                value_type: int
                min: 1

          - name: cours15min
            label: Cours individuel, 15 minutes (€)
            widget: number
            value_type: int
            min: 1
          - name: cours30min
            label: Cours individuel, 30 minutes (€)
            widget: number
            value_type: int
            min: 1
          - name: cours60min
            label: Cours individuel, 60 minutes (€)
            widget: number
            value_type: int
            min: 1
          - name: pack3seances
            label: Pack 3 séances (€)
            widget: number
            value_type: int
            min: 1
          - name: pack6seances
            label: Pack 6 séances (€)
            widget: number
            value_type: int
            min: 1

      # ─── Contact details ───────────────────────────────────────────────────
      - name: contact
        label: Coordonnées
        file: content/contact.json
        icon: contact_page
        description: >-
          Ces informations apparaissent dans le pied de page, sur la page
          contact et dans les mentions légales. Le lien WhatsApp est construit
          à partir du numéro de téléphone : il n’y a rien à saisir pour lui.
        fields:
          - name: phone
            label: Téléphone
            widget: string
            hint: 'Format international, sans espaces. Exemple : +33677704510'
            pattern:
              ['^\+[0-9]{8,15}$', 'Doit commencer par + et ne contenir que des chiffres.']
          - name: email
            label: Adresse e-mail
            widget: string
            pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]{2,}$', 'Adresse e-mail invalide.']
          - name: instagram
            label: Lien Instagram
            widget: string
            pattern: ['^https://', 'Doit commencer par https://']
          - name: youtube
            label: Lien YouTube
            widget: string
            pattern: ['^https://', 'Doit commencer par https://']
          - name: booking
            label: Lien de réservation (SimplyBook.me)
            widget: string
            pattern: ['^https://', 'Doit commencer par https://']

      # ─── Button links ──────────────────────────────────────────────────────
      - name: boutons
        label: Liens des boutons
        file: content/boutons.json
        icon: link
        description: >-
          Où mènent les principaux boutons du site. Une page du site commence
          par / (la page contact : /contact). Une adresse d’un autre site, comme
          une page SimplyBook, commence par https:// et s’ouvre dans un nouvel
          onglet. Le lien du bouton « Choisir un créneau d’appel » de la page
          contact se trouve dans Coordonnées.
        fields:
          - name: hero
            label: Accueil, « Réserver mon appel découverte »
            widget: string
            pattern: &link
              ['^(/\S*|https://\S+)$', 'Commence par / pour une page du site (exemple : /contact), ou par https:// pour un autre site. Sans espaces.']
          - name: dieteMindset
            label: Suivi diète & mindset, « Commencer mon suivi »
            widget: string
            pattern: *link
          - name: trainingDieteMindset
            label: Suivi training + diète & mindset, « Commencer mon suivi »
            widget: string
            pattern: *link
          - name: posing
            label: Suivi posing à distance (1 mois), « Commencer mon suivi »
            widget: string
            pattern: *link
          - name: posingComplet
            label: Suivi posing complet (3 mois), « Commencer mon suivi »
            widget: string
            pattern: *link
          - name: coursIndividuels
            label: Cours individuels, « Réserver une séance »
            widget: string
            pattern: *link
          - name: packs
            label: Packs de séances, « Choisir mon pack »
            widget: string
            pattern: *link

      # ─── Video testimonials ────────────────────────────────────────────────
      - name: temoignages-video
        label: Témoignages en vidéo
        file: content/temoignages-video.json
        icon: smart_display
        description: >-
          Le carrousel vidéo de la section « Témoignages ». Le premier de la
          liste s’affiche en premier ; fais glisser pour changer l’ordre.
        fields:
          - name: items
            label: Témoignages
            label_singular: témoignage
            widget: list
            summary: '{{fields.name}}'
            fields:
              - name: youtubeId
                label: Identifiant de la vidéo YouTube
                widget: string
                hint: >-
                  La partie après « v= » dans l’adresse YouTube. Pour
                  youtube.com/watch?v=m_LVMjK8QLM, saisis m_LVMjK8QLM
                pattern:
                  ['^[A-Za-z0-9_-]{11}$', 'Un identifiant YouTube fait 11 caractères.']
              - name: name
                label: Prénom de la cliente
                widget: string
              - name: credential
                label: Sous-titre
                widget: string
                hint: 'Exemple : 1 an d’accompagnement · Recomposition corporelle'
              - name: quotes
                label: Extraits cités
                label_singular: extrait
                widget: list
                field:
                  name: quote
                  label: Extrait
                  widget: text
                hint: >-
                  Les guillemets sont ajoutés automatiquement, ne les saisis
                  pas.

      # ─── Section photos ────────────────────────────────────────────────────
      - name: photos
        label: Photos des sections
        file: content/photos.json
        icon: image
        description: >-
          Les photos de l’accueil, de « Qui je suis » et du bloc posing de
          « Mes accompagnements ». Les photos avant / après et les captures
          d’avis sont dans l’entrée « Photos avant / après et avis ».
        fields:
          - name: hero
            label: Accueil (haut de la page)
            widget: object
            fields:
              - name: photo
                label: Photo
                widget: image
                choose_url: false
                hint: >-
                  Idéalement un PNG détouré (sans fond), en portrait, comme la
                  photo actuelle (1229 × 1387 pixels). Une photo avec un fond
                  s’affiche comme un rectangle.
              - name: alt
                label: Description de la photo
                widget: string
                hint: &photoAlt >-
                  Lue à voix haute par les lecteurs d’écran et affichée si la
                  photo ne charge pas. Décris ce qu’on voit.
              - name: silhouette
                label: Silhouette derrière la photo (facultatif)
                widget: image
                required: false
                choose_url: false
                hint: >-
                  L’aplat qui reprend exactement ta pose, juste derrière la
                  photo. Si tu changes de photo sans silhouette assortie, vide
                  ce champ : l’ancienne dépasserait autour de la nouvelle pose.

          - name: whoAmI
            label: Qui je suis
            widget: object
            fields:
              - name: photo
                label: Photo
                widget: image
                choose_url: false
                hint: >-
                  Au départ, la même photo que l’accueil : au défilement, tu
                  sors de l’accueil par la droite et tu reviens ici par la
                  gauche. Garde la même photo dans les deux pour conserver cet
                  effet. Idéalement un PNG détouré (sans fond), en portrait.
              - name: alt
                label: Description de la photo
                widget: string
                hint: *photoAlt
              - name: silhouette
                label: Silhouette derrière la photo (facultatif)
                widget: image
                required: false
                choose_url: false
                hint: >-
                  Ici en beige, pour ressortir sur le fond bleu nuit de la
                  section. Si tu changes de photo sans silhouette assortie, vide
                  ce champ : l’ancienne dépasserait autour de la nouvelle pose.

          - name: posing
            label: Bloc posing (à côté des cours individuels et des packs)
            widget: image
            choose_url: false
            hint: >-
              Affichée en entier, posée sur le bas du bloc. Idéalement une photo
              détourée (PNG ou WebP sans fond), en pied et en portrait, comme
              celle de la remise de prix. Une photo avec un fond s’affiche comme
              un rectangle.

      # ─── Photo galleries ───────────────────────────────────────────────────
      - name: galeries
        label: Photos avant / après et avis
        file: content/galeries.json
        icon: photo_library
        description: >-
          Les photos avant / après et les captures d’avis, affichées en deux
          carrousels sous « Leurs résultats », dans la section « Qui je suis ».
          Format conseillé : portrait, 1279 × 1600 pixels.
        fields:
          - name: results
            label: Photos avant / après
            label_singular: photo
            widget: list
            summary: '{{fields.alt}}'
            fields:
              - name: src
                label: Image
                widget: image
                choose_url: false
              - name: alt
                label: Description de l’image
                widget: string
                hint: >-
                  Lue à voix haute par les lecteurs d’écran et affichée si
                  l’image ne charge pas. Décris ce qu’on voit, avec les chiffres
                  s’il y en a.
          - name: reviews
            label: Captures d’avis
            label_singular: avis
            widget: list
            summary: '{{fields.alt}}'
            fields:
              - name: src
                label: Image
                widget: image
                choose_url: false
              - name: alt
                label: Résumé de l’avis
                widget: string
                hint: >-
                  Résume ce que dit la cliente. C’est le seul texte disponible
                  pour qui ne peut pas voir la capture.

      # ─── Latest vlog ───────────────────────────────────────────────────────
      - name: vlog
        label: Dernier vlog
        file: content/vlog.json
        icon: video_library
        description: >-
          L’onglet « Dernier vlog » sur le bord droit de la page d’accueil. La
          miniature et le lien vers YouTube se mettent à jour tout seuls à partir
          de l’identifiant de la vidéo.
        fields:
          - name: youtubeId
            label: Identifiant de la vidéo YouTube
            widget: string
            hint: >-
              La partie après « v= » dans l’adresse YouTube. Pour
              youtube.com/watch?v=sMHtrA3SmmM, saisis sMHtrA3SmmM
            pattern:
              ['^[A-Za-z0-9_-]{11}$', 'Un identifiant YouTube fait 11 caractères.']
          - name: title
            label: Titre de la vidéo
            widget: string
            hint: Recopie le titre tel qu’il apparaît sur YouTube.

      # ─── Vlog row ──────────────────────────────────────────────────────────
      - name: vlogs
        label: Vlogs
        file: content/vlogs.json
        icon: movie
        description: >-
          Les vidéos qui défilent dans la section « Mes vlogs », après les
          témoignages. Colle simplement le lien de chaque vidéo YouTube : le
          titre et la miniature sont récupérés tout seuls à chaque mise en
          ligne du site. La première de la liste passe en premier ; fais
          glisser pour changer l’ordre. Si la liste est vide, la section
          disparaît.
        fields:
          - name: videos
            label: Vidéos
            label_singular: vidéo
            widget: list
            field:
              name: url
              label: Lien de la vidéo YouTube
              widget: string
              hint: >-
                Sur YouTube : Partager, puis Copier le lien. Exemple :
                https://youtu.be/INMUt33c1iU
              pattern:
                ['^(https://(www\.|m\.)?(youtube\.com/(watch\?(\S*&)?v=|shorts/|live/)|youtu\.be/)[A-Za-z0-9_-]{11}([?&#/]\S*)?|[A-Za-z0-9_-]{11})$', 'Colle le lien d’une vidéo YouTube (youtu.be/… ou youtube.com/watch?v=…).']
